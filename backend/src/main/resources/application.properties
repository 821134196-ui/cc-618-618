# ---- 数据源：SQLite（Hibernate ORM） ----
quarkus.datasource.db-kind=sqlite
quarkus.datasource.jdbc.url=jdbc:sqlite:aed.db
# SQLite 为单写库，连接池设为 1，串行化访问避免 SQLITE_BUSY
quarkus.datasource.jdbc.max-size=1
quarkus.hibernate-orm.database.generation=update

# ---- HTTP ----
quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# ---- 业务参数 ----
# 巡检有效期（天）：超过该天数未巡检即视为“巡检过期”
app.inspection-valid-days=90
# 首次启动时写入演示数据（数据库为空时）
app.seed.enabled=true

# ---- 测试环境：独立 SQLite 文件，不启用种子数据 ----
%test.quarkus.datasource.jdbc.url=jdbc:sqlite:file:target/test-aed.sqlite
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.app.seed.enabled=false
