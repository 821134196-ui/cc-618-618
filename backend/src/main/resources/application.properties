# ---- 数据源：SQLite（Hibernate ORM 访问） ----
quarkus.datasource.db-kind=sqlite
# WAL + busy_timeout：避免 SQLite 文件锁在并发启动/schema 初始化时冲突
quarkus.datasource.jdbc.url=jdbc:sqlite:aed-city.db?busy_timeout=10000
quarkus.hibernate-orm.dialect=org.hibernate.community.dialect.SQLiteDialect
quarkus.hibernate-orm.database.generation=update

# ---- HTTP ----
quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=*

# ---- 测试 profile：独立数据库文件，每次重建 ----
%test.quarkus.datasource.jdbc.url=jdbc:sqlite:target/test-aed.db?busy_timeout=10000
%test.quarkus.hibernate-orm.database.generation=drop-and-create
